name: Bug Report
description: Create a report to help us improve Ariba Shield WAF.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please do not report security vulnerabilities here; refer to `SECURITY.md`.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Ariba Shield are you running? (e.g., v0.1.0)
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: How are you running the WAF?
      options:
        - Docker Compose
        - Kubernetes (Helm)
        - Bare Metal
    validations:
      required: true
