components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: shield_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    Application:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string }
        owner_user_id: { type: string }
        version: { type: integer }
    VirtualServer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        listen_addr: { type: string }
        listen_port: { type: integer }
        tls_enabled: { type: boolean }
        certificate_ref: { type: string }
        default_backend_pool_id: { type: string }
        version: { type: integer }
    BackendPool:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        application_id: { type: string }
        lb_algorithm: { type: string }
        version: { type: integer }
        nodes:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              host: { type: string }
              port: { type: integer }
              weight: { type: integer }
              active: { type: boolean }
    HealthMonitor:
      type: object
      properties:
        id: { type: string }
        pool_id: { type: string }
        type: { type: string }
        interval_ms: { type: integer }
        timeout_ms: { type: integer }
        fail_threshold: { type: integer }
        pass_threshold: { type: integer }
        http_path: { type: string }
    SecurityPolicy:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        enforcement_mode: { type: string }
        application_id: { type: string }
        version: { type: integer }
    IPList:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        list_type: { type: string }
        entries: { type: array, items: { type: string } }
        description: { type: string }
        version: { type: integer }
    RateLimit:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        application_id: { type: string }
        route_prefix: { type: string }
        limit_count: { type: integer }
        window_seconds: { type: integer }
        action: { type: string }
        version: { type: integer }
    CustomRule:
      type: object
      properties:
        id: { type: string }
        policy_id: { type: string }
        name: { type: string }
        description: { type: string }
        action: { type: string }
        status: { type: string }
    ManagedRule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        enabled: { type: boolean }
        sensitivity: { type: string }
        status: { type: string }
    Webhook:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        severity: { type: array, items: { type: string } }
        event_types: { type: array, items: { type: string } }
        max_retry_attempts: { type: integer }
        status: { type: string }
    Exception:
      type: object
      properties:
        id: { type: string }
        policy_id: { type: string }
        application_id: { type: string }
        rule_id: { type: string }
        url_pattern: { type: string }
        parameter: { type: string }
        reason: { type: string }
        expires_at: { type: string }
        status: { type: string }
    Certificate:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        domain: { type: string }
        issuer: { type: string }
        serial: { type: string }
        not_before: { type: string }
        not_after: { type: string }
        status: { type: string }
    Deployment:
      type: object
      properties:
        id: { type: string }
        policy_version_id: { type: string }
        target_gateways: { type: array, items: { type: string } }
        status: { type: string }
        error: { type: string }
    Gateway:
      type: object
      properties:
        id: { type: string }
        hostname: { type: string }
        ip: { type: string }
        version: { type: string }
        status: { type: string }
        last_seen_at: { type: string }
        applied_hash: { type: string }
    SecurityEvent:
      type: object
      properties:
        id: { type: string }
        event_id: { type: string }
        request_id: { type: string }
        severity: { type: string }
        decision_action: { type: string }
        reason: { type: string }
        rule_ids: { type: array, items: { type: string } }
        client_ip: { type: string }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        created_at: { type: string }
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        actor_user_id: { type: string }
        ip: { type: string }
        request_id: { type: string }
        created_at: { type: string }
    AccessEvent:
      type: object
      properties:
        event_id: { type: string }
        request_id: { type: string }
        gateway_id: { type: string }
        application_id: { type: string }
        client_ip: { type: string }
        method: { type: string }
        path: { type: string }
        host: { type: string }
        status: { type: integer }
        bytes: { type: integer }
        latency_ms: { type: number }
        backend_node: { type: string }
        decision_action: { type: string }
        created_at: { type: string }
    ConfigVersion:
      type: object
      properties:
        id: { type: string }
        version: { type: integer }
        bundle_hash: { type: string }
        status: { type: string }
        created_by: { type: string }
        created_at: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string }
        created_at: { type: string }
