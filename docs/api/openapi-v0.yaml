openapi: 3.0.3
info:
  title: Ariba Shield WAF Control API
  version: 0.2.0
  description: >
    Management REST/JSON API for the Ariba Shield WAF control plane. HTTPS only,
    bound to the management network. Authenticated via the `shield_session`
    cookie (set by POST /auth/login). Write endpoints accept `Idempotency-Key`;
    optimistic concurrency via `If-Match`/`X-Expected-Version` (409 on mismatch).
servers:
  - url: https://control-api.ariba-shield.local
    description: Management network
security:
  - CookieAuth: []
tags:
  - name: auth
  - name: applications
  - name: virtual-servers
  - name: backend-pools
  - name: health-monitors
  - name: security-policies
  - name: policy-versions
  - name: ip-lists
  - name: rate-limits
  - name: custom-rules
  - name: managed-rules
  - name: webhooks
  - name: exceptions
  - name: certificates
  - name: deployments
  - name: gateways
  - name: security-events
  - name: audit-events
  - name: traffic
  - name: config-versions
  - name: users
  - name: backups
  - name: health
  - name: analytics
  - name: api-key
  - name: api-quota
  - name: api-security-policy
  - name: application
  - name: audit-event
  - name: automation-policy
  - name: backend-node
  - name: backend-pool
  - name: bot-challenge
  - name: bot-client
  - name: bot-event
  - name: bot-management
  - name: bot-policy
  - name: caching-policy
  - name: certificate
  - name: client-side-protection-policy
  - name: cluster
  - name: config-validation
  - name: dashboard
  - name: dlp-policy
  - name: exception
  - name: gateway
  - name: gateway-cluster
  - name: graphql-security-policy
  - name: group
  - name: iam-policy
  - name: incident
  - name: integration
  - name: ip-list
  - name: learning-session
  - name: learning-suggestion
  - name: license
  - name: listener
  - name: ml-baseline
  - name: network-protection-policy
  - name: notification-channel
  - name: organization
  - name: permission
  - name: policy-approval
  - name: report
  - name: role
  - name: route
  - name: rule
  - name: rule-analytics
  - name: rule-bundle
  - name: secret
  - name: security-event
  - name: security-policy
  - name: service-account
  - name: settings
  - name: site
  - name: tenant
  - name: threat-feed
  - name: threat-intelligence-policy
  - name: tls-profile
  - name: user
  - name: workspace
paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Liveness/readiness check (no auth)
      responses:
        "200": { description: Healthy }
  /api/v1/metrics:
    get:
      tags: [health]
      summary: Prometheus metrics (no auth)
      responses:
        "200": { description: Metrics text }

  # ---------- Auth ----------
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate with email+password; sets shield_session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Session established }
        "401": { description: Invalid credentials }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Invalidate session and clear cookie
      responses:
        "200": { description: Logged out }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user (email + role)
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      role: { type: string }

  # ---------- Applications ----------
  /api/v1/applications:
    get:
      tags: [applications]
      summary: List applications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
    post:
      tags: [applications]
      summary: Create an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201": { description: Created }
  /api/v1/applications/{id}:
    get:
      tags: [applications]
      summary: Get an application
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Application }
    patch:
      tags: [applications]
      summary: Update an application (partial)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                status: { type: string, enum: [active, disabled] }
      responses:
        "200": { description: Updated }
        "409": { description: Version conflict }
    delete:
      tags: [applications]
      summary: Delete an application
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted }
        "404": { description: Not found }
  /api/v1/applications/{id}/domains:
    get:
      tags: [applications]
      summary: List domains for an application
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Domains
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    hostname: { type: string }
                    enabled: { type: boolean }
    post:
      tags: [applications]
      summary: Add a domain
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string }
                enabled: { type: boolean }
      responses:
        "201": { description: Created }
  /api/v1/applications/{id}/origins:
    get:
      tags: [applications]
      summary: List origins (upstreams) for an application
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Origins
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    protocol: { type: string }
                    host: { type: string }
                    port: { type: integer }
                    weight: { type: integer }
                    enabled: { type: boolean }
    post:
      tags: [applications]
      summary: Add an origin
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, host]
              properties:
                name: { type: string }
                protocol: { type: string, enum: [http, https] }
                host: { type: string }
                port: { type: integer }
                weight: { type: integer }
      responses:
        "201": { description: Created }

  # ---------- Virtual servers ----------
  /api/v1/virtual-servers:
    get:
      tags: [virtual-servers]
      summary: List virtual servers
      responses:
        "200":
          description: Virtual servers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VirtualServer" }
    post:
      tags: [virtual-servers]
      summary: Create a virtual server
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, listen_port]
              properties:
                name: { type: string }
                listen_addr: { type: string, default: "0.0.0.0" }
                listen_port: { type: integer }
                tls_enabled: { type: boolean, default: true }
                certificate_ref: { type: string }
                default_backend_pool_id: { type: string }
      responses:
        "201": { description: Created }
  /api/v1/virtual-servers/{id}:
    delete:
      tags: [virtual-servers]
      summary: Delete a virtual server
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted }

  # ---------- Backend pools ----------
  /api/v1/backend-pools:
    get:
      tags: [backend-pools]
      summary: List backend pools (with nodes)
      responses:
        "200":
          description: Backend pools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackendPool" }
    post:
      tags: [backend-pools]
      summary: Create a backend pool
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, application_id]
              properties:
                name: { type: string }
                application_id: { type: string }
                lb_algorithm: { type: string, enum: [round_robin, weighted, least_conn, ip_hash, consistent_hash] }
      responses:
        "201": { description: Created }
  /api/v1/backend-pools/{id}:
    get:
      tags: [backend-pools]
      summary: Get a backend pool
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Backend Pool }
    patch:
      tags: [backend-pools]
      summary: Update a backend pool (partial)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Updated }
    delete:
      tags: [backend-pools]
      summary: Delete a backend pool
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted }

  # ---------- Health monitors ----------
  /api/v1/health-monitors:
    get:
      tags: [health-monitors]
      summary: List health monitors
      responses:
        "200":
          description: Health monitors
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HealthMonitor" }
    post:
      tags: [health-monitors]
      summary: Create a health monitor
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pool_id]
              properties:
                pool_id: { type: string }
                type: { type: string, enum: [tcp, http], default: http }
                interval_ms: { type: integer, default: 5000 }
                timeout_ms: { type: integer, default: 2000 }
                fail_threshold: { type: integer, default: 3 }
                pass_threshold: { type: integer, default: 2 }
                http_path: { type: string, default: /healthz }
      responses:
        "201": { description: Created }
  /api/v1/health-monitors/{id}:
    delete:
      tags: [health-monitors]
      summary: Delete a health monitor
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted }

  # ---------- Security policies ----------
  /api/v1/security-policies:
    get:
      tags: [security-policies]
      summary: List security policies
      responses:
        "200":
          description: Security policies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecurityPolicy" }
    post:
      tags: [security-policies]
      summary: Create a security policy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                enforcement_mode: { type: string, enum: [transparent, alarm, blocking], default: transparent }
                application_id: { type: string }
      responses:
        "201": { description: Created }
  /api/v1/security-policies/{id}:
    get:
      tags: [security-policies]
      summary: Get a security policy
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Security Policy }
    patch:
      tags: [security-policies]
      summary: Update a security policy (partial)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                enforcement_mode: { type: string, enum: [transparent, alarm, blocking] }
      responses:
        "200": { description: Updated }
    delete:
      tags: [security-policies]
      summary: Delete a security policy
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted }
  /api/v1/security-policies/bind:
    post:
      tags: [security-policies]
      summary: Bind a policy to an application
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [policy_id, application_id]
              properties:
                policy_id: { type: string }
                application_id: { type: string }
                enforcement_mode: { type: string, enum: [transparent, alarm, blocking] }
      responses:
        "200": { description: Bound }

  # ---------- Policy versions ----------
  /api/v1/security-policies/{id}/versions:
    get:
      tags: [policy-versions]
      summary: List policy version history
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Policy versions }
    post:
      tags: [policy-versions]
      summary: Create an immutable policy version (first auto-stages)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document: { type: object }
                bundle_hash: { type: string }
      responses:
        "201": { description: Created }
  /api/v1/policy-versions/diff:
    get:
      tags: [policy-versions]
      summary: Field-level diff between two versions
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: array, items: { type: string } }
                  removed: { type: array, items: { type: string } }
                  changed: { type: array, items: { type: string } }
  /api/v1/policy-versions/{id}/activate:
    post:
      tags: [policy-versions]
      summary: Activate a version (demotes prior active)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Activated }
  /api/v1/policy-versions/{id}/promote:
    post:
      tags: [policy-versions]
      summary: Promote draft->staging->approved->canary->active
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: to, in: query, schema: { type: string, enum: [staging, approved, canary, active] } }
      responses:
        "200": { description: Promoted }
  /api/v1/policy-versions/{id}/rollback:
    post:
      tags: [policy-versions]
      summary: Roll back to the last active version
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Rolled back }

  # ---------- IP lists ----------
  /api/v1/ip-lists:
    get:
      tags: [ip-lists]
      summary: List IP lists
      responses:
        "200":
          description: IP lists
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IPList" }
    post:
      tags: [ip-lists]
      summary: Create an IP list
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, list_type]
              properties:
                name: { type: string }
                list_type: { type: string, enum: [allowed, blocked] }
                entries: { type: array, items: { type: string } }
                description: { type: string }
      responses:
        "201": { description: Created }
  /api/v1/ip-lists/{id}:
    get:
      tags: [ip-lists]
      summary: Get an IP list
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: IP List }
    patch:
      tags: [ip-lists]
      summary: Update an IP list
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                list_type: { type: string, enum: [allowed, blocked] }
                entries: { type: array, items: { type: string } }
                description: { type: string }
      responses:
        "200": { description: Updated }
    delete:
      tags: [ip-lists]
      summary: Delete an IP list
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted }

  # ---------- Rate limits ----------
  /api/v1/rate-limits:
    get:
      tags: [rate-limits]
      summary: List rate limit policies
      responses:
        "200":
          description: Rate limit policies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RateLimit" }
    post:
      tags: [rate-limits]
      summary: Create a rate limit policy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, limit_count]
              properties:
                name: { type: string }
                application_id: { type: string }
                route_prefix: { type: string }
                limit_count: { type: integer }
                window_seconds: { type: integer, default: 60 }
                action: { type: string, enum: [throttle, block], default: throttle }
      responses:
        "201": { description: Created }
  /api/v1/rate-limits/{id}:
    patch:
      tags: [rate-limits]
      summary: Update a rate limit policy
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                route_prefix: { type: string }
                limit_count: { type: integer }
                window_seconds: { type: integer }
                action: { type: string }
      responses:
        "200": { description: Updated }
    delete:
      tags: [rate-limits]
      summary: Delete a rate limit policy
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted }

  # ---------- Custom rules ----------
  /api/v1/custom-rules:
    get:
      tags: [custom-rules]
      summary: List custom rules
      responses:
        "200":
          description: Custom rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomRule" }
    post:
      tags: [custom-rules]
      summary: Create a custom rule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                policy_id: { type: string }
                name: { type: string }
                description: { type: string }
                action: { type: string, enum: [BLOCK, LOG, ALLOW], default: BLOCK }
                match_conditions: { type: object }
      responses:
        "201": { description: Created }

  # ---------- Managed rules ----------
  /api/v1/managed-rules:
    get:
      tags: [managed-rules]
      summary: List managed rule sets
      responses:
        "200":
          description: Managed rule sets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManagedRule" }
  /api/v1/managed-rules/{id}:
    post:
      tags: [managed-rules]
      summary: Configure a managed rule set (enabled/sensitivity)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                sensitivity: { type: string }
      responses:
        "200": { description: Updated }

  # ---------- Webhooks ----------
  /api/v1/webhooks:
    get:
      tags: [webhooks]
      summary: List webhooks
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
    post:
      tags: [webhooks]
      summary: Create a webhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string }
                url: { type: string }
                severity: { type: array, items: { type: string } }
                event_types: { type: array, items: { type: string } }
                custom_headers: { type: object }
                max_retry_attempts: { type: integer, default: 3 }
      responses:
        "201": { description: Created }

  # ---------- Exceptions ----------
  /api/v1/exceptions:
    get:
      tags: [exceptions]
      summary: List policy exceptions
      responses:
        "200":
          description: Exceptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Exception" }
    post:
      tags: [exceptions]
      summary: Create a time-limited exception (reason required)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                policy_id: { type: string }
                application_id: { type: string }
                rule_id: { type: string }
                url_pattern: { type: string }
                parameter: { type: string }
                reason: { type: string }
                expires_at: { type: string, format: date-time }
      responses:
        "201": { description: Created }

  # ---------- Certificates ----------
  /api/v1/certificates:
    get:
      tags: [certificates]
      summary: List certificate metadata (never key material)
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Certificate" }
    post:
      tags: [certificates]
      summary: Upload a certificate (PEM); parses metadata; never stores the key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, domain, certificate]
              properties:
                name: { type: string }
                domain: { type: string }
                certificate: { type: string }
      responses:
        "201": { description: Imported }

  # ---------- Deployments ----------
  /api/v1/deployments:
    get:
      tags: [deployments]
      summary: List deployment history
      responses:
        "200":
          description: Deployments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deployment" }
    post:
      tags: [deployments]
      summary: Sync a policy version to target gateways
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [policy_version_id, target_gateways]
              properties:
                policy_version_id: { type: string }
                target_gateways: { type: array, items: { type: string } }
      responses:
        "202": { description: Accepted }

  # ---------- Gateways ----------
  /api/v1/gateways:
    get:
      tags: [gateways]
      summary: List gateway fleet with status + applied hash
      responses:
        "200":
          description: Gateways
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Gateway" }
  /api/v1/gateways/register:
    post:
      tags: [gateways]
      summary: Register a gateway (idempotent)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [gateway_id, hostname]
              properties:
                gateway_id: { type: string }
                hostname: { type: string }
                ip: { type: string }
                version: { type: string }
                capabilities: { type: array, items: { type: string } }
      responses:
        "200": { description: Registered }
  /api/v1/gateways/{id}/heartbeat:
    post:
      tags: [gateways]
      summary: Report heartbeat + applied config hash
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
                applied_hash: { type: string }
                version: { type: string }
                health: { type: object }
                last_error: { type: string }
      responses:
        "200": { description: Heartbeat recorded }
  /api/v1/gateways/{id}/config/current:
    get:
      tags: [gateways]
      summary: Pull the latest active config bundle (ETag/304)
      parameters:
        - { $ref: "#/components/parameters/Id" }
