# Ariba Shield WAF — baseline WAF rules (Release 0.1, detection-only)
# Minimal CRS-style rule set. Full OWASP CRS is a Phase 2+ integration;
# this baseline exercises the Coraza engine + event path.
# Reference: master plan §6.3, Phase 2 (OWASP CRS baseline).

# --- Core engine directives ---
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecResponseBodyAccess Off
SecPcreMatchLimit 1000
SecPcreMatchLimitRecursion 1000

# --- Anomaly scoring (basic) ---
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.anomaly_score=0"
SecAction "id:900001,phase:1,nolog,pass,t:none,setvar:tx.blocking_anomaly_score=1"

# --- SQL Injection (detection) ---
SecRule ARGS|REQUEST_HEADERS|REQUEST_COOKIES \
    "union.{0,100}select|select.{0,100}from|insert.{0,20}into|update.{0,30}set|delete.{0,20}from|or.{1,2}\d+=\d+|\d+\s*or\s+\d+=\d+" \
    "id:950001,phase:2,pass,t:none,t:urlDecodeUni,t:lowercase,msg:'SQL Injection Attack',tag:'attack-sqli',tag:'OWASP_CRS',logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',severity:'CRITICAL',setvar:tx.anomaly_score=+1"

# --- Cross-Site Scripting (detection) ---
SecRule ARGS|REQUEST_HEADERS|REQUEST_COOKIES \
    "<script|javascript:|onload|onerror|onclick" \
    "id:950002,phase:2,pass,t:none,t:urlDecodeUni,t:lowercase,msg:'Cross-site Scripting (XSS) Attack',tag:'attack-xss',tag:'OWASP_CRS',logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',severity:'CRITICAL',setvar:tx.anomaly_score=+1"

# --- Command Injection (detection) ---
SecRule ARGS|REQUEST_HEADERS|REQUEST_COOKIES \
    ";\s*(whoami|id|pwd|wget|curl|cat|ls)|;/bin/|;\s*(sh|bash|cmd|powershell)|(whoami|id|pwd)\s|\|\s*(whoami|id|pwd|wget|curl)" \
    "id:950003,phase:2,pass,t:none,t:urlDecodeUni,t:lowercase,msg:'Command Injection Attack',tag:'attack-cmd-injection',tag:'OWASP_CRS',logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',severity:'CRITICAL',setvar:tx.anomaly_score=+1"

# --- Path Traversal (detection) ---
SecRule REQUEST_URI|ARGS \
    "\.\./|%2e%2e%2f|%2e%2e/" \
    "id:950004,phase:1,pass,t:none,t:urlDecodeUni,t:lowercase,msg:'Path Traversal Attack',tag:'attack-path-traversal',tag:'OWASP_CRS',logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',severity:'CRITICAL',setvar:tx.anomaly_score=+1"

# --- Local File Inclusion (detection) ---
SecRule ARGS|REQUEST_URI \
    "file://|http://|https://|php://|data://|include" \
    "id:950005,phase:2,pass,t:none,t:urlDecodeUni,t:lowercase,msg:'File Inclusion Attack',tag:'attack-lfi',tag:'OWASP_CRS',logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',severity:'CRITICAL',setvar:tx.anomaly_score=+1"

# --- Sensitive File Read (detection) ---
SecRule ARGS|REQUEST_URI \
    "/etc/passwd|/etc/shadow|/root/.ssh/" \
    "id:950006,phase:2,pass,t:none,t:urlDecodeUni,t:lowercase,msg:'Sensitive File Read Attempt',tag:'attack-lfi',tag:'OWASP_CRS',logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',severity:'CRITICAL',setvar:tx.anomaly_score=+1"
# --- Inbound Anomaly Score Gate (blocking threshold) ---
# Runs AFTER all scoring rules so the cumulative anomaly score is final.
SecRule TX:ANOMALY_SCORE "@ge %{tx.blocking_anomaly_score}" \
    "id:949110,phase:2,deny,msg:'Inbound Anomaly Score Exceeded',tag:'anomaly-threshold',severity:'CRITICAL'"
