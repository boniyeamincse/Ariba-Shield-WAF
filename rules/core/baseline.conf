# Ariba Shield WAF — Full OWASP CRS integration
# Uses github.com/corazawaf/coraza-coreruleset

# --- Core engine directives ---
Include @coraza.conf-recommended

SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecResponseBodyAccess Off
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# --- CRS Setup ---
Include @crs-setup.conf.example

# Default paranoia level
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.paranoia_level=1"

# --- Include all CRS Rules ---
Include @owasp_crs/*.conf

# --- Anomaly Score Threshold ---
# The engine overrides this if --anomaly-threshold is provided.
SecAction "id:900001,phase:1,nolog,pass,t:none,setvar:tx.blocking_anomaly_score=5"
